<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#2f5f52" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Book Builder" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>Book Builder</title>
  <link rel="stylesheet" href="styles.css" />
  <style id="dynamicPageStyle">@page{size:6in 9in;margin:0}</style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div>
          <h1>Book Builder</h1>
          <p>Write, arrange, preview, print</p>
        </div>
        <button id="newChapterBtn" class="primary small">+ Chapter</button>
      </div>

      <section class="book-meta">
        <label>Book title<input id="bookTitle" /></label>
        <label>Subtitle<input id="bookSubtitle" /></label>
        <label>Author<input id="bookAuthor" /></label>
      </section>

      <div class="chapter-header">
        <span>Chapters</span>
        <span id="chapterCount"></span>
      </div>
      <div id="chapterList" class="chapter-list"></div>

      <div class="sidebar-actions">
        <button id="exportProjectBtn">Back Up Project</button>
        <label class="file-button">Restore Project<input id="importProjectInput" type="file" accept="application/json" hidden /></label>
        <button id="resetBtn" class="danger-ghost">Reset</button>
      </div>
    </aside>

    <main class="workspace">
      <div class="mobile-nav">
        <button id="mobileChaptersBtn">☰ Chapters</button>
        <div class="mobile-nav-title">Book Builder</div>
        <button id="mobilePreviewBtn">Preview</button>
      </div>

      <header class="toolbar">
        <div class="toolbar-left">
          <input id="chapterTitle" class="chapter-title-input" placeholder="Chapter title" />
          <input id="chapterMeta" class="chapter-meta-input" placeholder="Date / location / contributor line" />
        </div>
        <div class="toolbar-right">
          <button id="addNoteBtn">+ Side note</button>
          <button id="exportPdfBtn" class="primary">Export PDF</button>
        </div>
      </header>

      <div class="editor-preview-wrap">
        <section class="editor-pane">
          <div class="pane-title">
            <span>Write</span>
            <span id="saveStatus">Saved</span>
          </div>
          <div class="chapter-editor">
            <label class="field-label" for="chapterBody">Chapter text</label>
            <textarea id="chapterBody" class="chapter-body" placeholder="Write or paste the whole chapter here.

Leave one blank line between paragraphs."></textarea>

            <div class="notes-heading">
              <div>
                <strong>Side notes</strong>
                <small>Attach each note after a paragraph. The note will sit beside the story without taking a full column.</small>
              </div>
              <button id="addNoteInlineBtn">+ Add note</button>
            </div>
            <div id="notesEditor" class="notes-editor"></div>
          </div>
        </section>

        <section class="preview-pane">
          <div class="pane-title preview-title">
            <div>
              <span>Full Book Preview</span>
              <span id="pageCount" class="page-count"></span>
            </div>
            <div class="preview-controls">
              <label>Trim
                <select id="trimSize">
                  <option value="6x9">6 × 9 in</option>
                  <option value="5.5x8.5">5.5 × 8.5 in</option>
                  <option value="5x8">5 × 8 in</option>
                </select>
              </label>
              <label>Body
                <select id="fontSize">
                  <option value="10.5">10.5 pt</option>
                  <option value="11" selected>11 pt</option>
                  <option value="11.5">11.5 pt</option>
                  <option value="12">12 pt</option>
                </select>
              </label>
            </div>
          </div>
          <div id="previewScroller" class="preview-scroller">
            <div id="bookPreview" class="book-preview"></div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div id="sidebarBackdrop" class="sidebar-backdrop"></div>

  <template id="noteTemplate">
    <div class="note-card">
      <div class="note-card-top">
        <input class="note-heading-input" placeholder="Short heading" />
        <button class="note-delete" title="Delete note">×</button>
      </div>
      <textarea class="note-body-input" rows="3" placeholder="Practical thought, lesson, or observation…"></textarea>
      <div class="note-options">
        <label>Place after paragraph
          <input class="note-anchor-input" type="number" min="0" step="1" inputmode="numeric" />
        </label>
        <label>Side
          <select class="note-align-input">
            <option value="right">Right</option>
            <option value="left">Left</option>
          </select>
        </label>
      </div>
    </div>
  </template>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
